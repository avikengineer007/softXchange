[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:auth-service]
command=python -m uvicorn src.main:app --host 0.0.0.0 --port 8001 --workers 1
directory=/app/apps/auth-service
autostart=true
autorestart=true
startretries=5
startsecs=5
stderr_logfile=/var/log/supervisor/auth-service.err.log
stdout_logfile=/var/log/supervisor/auth-service.out.log
environment=PYTHONPATH="/app:/app/Secret Scanner engine:/app/packages/ml-shared/src:/app/packages/types/src"

