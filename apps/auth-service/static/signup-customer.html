<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Signup — softXchange</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-badge">
        <span class="dot"></span>
        Manifest Marketplace
      </div>
      <h1 class="brand-title">softXchange</h1>
      <p class="brand-subtitle">Create your customer account</p>
    </div>

    <div class="auth-card">
      <div class="role-tabs">
        <a href="/static/signup-customer.html" class="role-tab active">Customer Signup</a>
        <a href="/static/signup-seller.html" class="role-tab">Seller Signup</a>
      </div>

      <h2 class="card-title">Join softXchange</h2>
      <p class="card-description">Get instant access to verified software packages, source code, and licenses.</p>

      <!-- Inline Error Alert -->
      <div id="error-alert" class="alert alert-error" role="alert">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" style="flex-shrink:0;">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <span id="error-message"></span>
      </div>

      <!-- Inline Success Alert -->
      <div id="success-alert" class="alert alert-success" role="alert">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor" style="flex-shrink:0;">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <div>
          <strong id="success-heading">Registration Successful!</strong>
          <p id="success-message" style="margin-top:4px; font-size:12px;"></p>
        </div>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="display-name">Display Name (Optional)</label>
          <input 
            type="text" 
            id="display-name" 
            name="display-name" 
            class="form-input" 
            placeholder="Jane Doe" 
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="jane@example.com" 
            required 
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 8 characters)</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required 
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="btn-text">Create Customer Account</span>
          <div id="btn-spinner" class="spinner"></div>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? 
        <a href="/static/login-customer.html">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    const signupForm = document.getElementById("signup-form");
    const errorAlert = document.getElementById("error-alert");
    const errorMessage = document.getElementById("error-message");
    const successAlert = document.getElementById("success-alert");
    const successMessage = document.getElementById("success-message");
    const submitBtn = document.getElementById("submit-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.classList.add("show");
      successAlert.classList.remove("show");
    }

    function showSuccess(msg) {
      successMessage.textContent = msg;
      successAlert.classList.add("show");
      errorAlert.classList.remove("show");
      signupForm.style.display = "none";
    }

    function clearMessages() {
      errorAlert.classList.remove("show");
      successAlert.classList.remove("show");
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.style.display = isLoading ? "inline-block" : "none";
      btnText.textContent = isLoading ? "Creating account..." : "Create Customer Account";
    }

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();
      setLoading(true);

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const displayName = document.getElementById("display-name").value;

      try {
        const result = await window.SoftXchangeAuth.signup(email, password, ["customer"], displayName);
        setLoading(false);
        showSuccess(result.message + " You can now proceed to login.");
      } catch (err) {
        setLoading(false);
        showError(err.message || "Failed to create account.");
      }
    });
  </script>
</body>
</html>
