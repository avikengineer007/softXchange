<!DOCTYPE html>
<html lang="en" data-tier="C">
<!-- data-tier default "C" — JS upgrades after capability detection.
     Only one WebGL context will ever exist on this page (the hero on index.html);
     card tilt uses CSS transforms only, no WebGL context created here. -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vetted Software Catalog — softXchange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <a href="/static/index.html" class="brand-link">
      <!-- Geometric Bowtie Logo Mark -->
      <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="bl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--accent-blue)"/>
            <stop offset="100%" stop-color="var(--accent-violet)"/>
          </linearGradient>
        </defs>
        <path d="M4 5v14l8-7-8-7zm16 0v14l-8-7 8-7z" fill="url(#bl-grad)"/>
      </svg>
      <h1>softXchange</h1>
    </a>
    <nav class="nav-links" id="site-nav-links">
      <a href="/static/browse-listings.html" class="active">Catalog</a>
      <a href="/static/seller-listings.html">Seller Portal</a>
      <a href="http://localhost:8001/static/login-customer.html">Sign In</a>
    </nav>
  </header>

  <main class="container page-transition">
    <section class="catalog-hero">
      <h2>Vetted Software Marketplace</h2>
      <p>Every software package is cryptographically scanned for secrets and seller-verified prior to publication.</p>
    </section>

    <!-- Search & Filters -->
    <section class="filter-bar">
      <input type="text" id="search-query" class="search-input" placeholder="Search developer tools, utilities, libraries...">
      <select id="category-filter" class="filter-select">
        <option value="">All Categories</option>
        <option value="developer-tools">Developer Tools</option>
        <option value="security">Security &amp; Privacy</option>
        <option value="productivity">Productivity</option>
        <option value="infrastructure">Infrastructure</option>
        <option value="utilities">Utilities</option>
      </select>
      <select id="price-filter" class="filter-select">
        <option value="">Any Price</option>
        <option value="free">Free ($0.00)</option>
        <option value="under25">Under $25</option>
        <option value="under100">Under $100</option>
      </select>
      <button id="btn-search" class="btn-filter">Search Catalog</button>
    </section>

    <!-- Listings Grid -->
    <div id="listings-container" class="listing-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 48px 0; color: var(--text-secondary);">
        Loading vetted packages...
      </div>
    </div>
  </main>

  <script>
    async function loadCatalog() {
      const query = document.getElementById('search-query').value.trim();
      const category = document.getElementById('category-filter').value;
      const priceFilter = document.getElementById('price-filter').value;

      const apiHost = window.location.port === "8003" ? "" : "http://localhost:8003";
      let url = `${apiHost}/listings?`;
      const params = new URLSearchParams();
      if (query) params.append('search', query);
      if (category) params.append('category', category);
      
      if (priceFilter === 'free') {
        params.append('max_price_cents', '0');
      } else if (priceFilter === 'under25') {
        params.append('max_price_cents', '2500');
      } else if (priceFilter === 'under100') {
        params.append('max_price_cents', '10000');
      }

      url += params.toString();

      const container = document.getElementById('listings-container');
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Failed to fetch listings');
        const items = await res.json();
        
        container.innerHTML = '';
        if (!Array.isArray(items) || items.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; background: var(--bg-surface); border: 1px dashed var(--color-border); border-radius: var(--radius-md);">
              <h3 style="font-family: var(--font-heading); font-size: 20px; color: var(--text-secondary); margin-bottom: 8px;">No vetted packages found</h3>
              <p style="font-size: 14px; color: var(--text-muted);">Try adjusting your search criteria or check back later.</p>
            </div>
          `;
          return;
        }

        items.forEach(item => {
          const card = document.createElement('a');
          card.className = 'listing-card';
          card.href = `/static/listing-detail.html?id=${item.id}`;

          const formattedPrice = item.price_cents === 0 ? 'Free' : `$${(item.price_cents / 100).toFixed(2)}`;

          card.innerHTML = `
            <div>
              <div class="listing-card-header">
                <span class="card-category">${escapeHtml(item.category || 'Software')}</span>
                <span class="card-price">${formattedPrice}</span>
              </div>
              <h3 class="card-title">${escapeHtml(item.title)}</h3>
              <p class="card-description">${escapeHtml(item.description || 'No description provided.')}</p>
            </div>
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--color-border);">
                <div class="vetted-badge">
                  <span class="dot"></span>
                  <span>Scanned — 0 critical findings</span>
                </div>
                <span style="font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);">v${escapeHtml(item.version_label || '1.0.0')}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = `<div style="grid-column: 1 / -1; color: var(--color-danger); text-align: center; padding: 32px;">Error loading catalog: ${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('btn-search').addEventListener('click', loadCatalog);
    document.getElementById('search-query').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') loadCatalog();
    });
    document.getElementById('category-filter').addEventListener('change', loadCatalog);
    document.getElementById('price-filter').addEventListener('change', loadCatalog);

    window.addEventListener('DOMContentLoaded', () => {
      loadCatalog();

      // Check for admin role in stored token
      try {
        const token = localStorage.getItem('seller_access_token') || localStorage.getItem('admin_access_token');
        if (token) {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const roles = payload.roles || [];
          const nav = document.getElementById('site-nav-links');
          if (roles.includes('admin')) {
            const adminLink = document.createElement('a');
            adminLink.href = 'http://localhost:8001/static/admin-dashboard.html';
            adminLink.className = 'nav-admin-link';
            adminLink.innerHTML = '🛡️ Admin Console';
            nav.prepend(adminLink);
          }
        }
      } catch (e) {}
    });
  </script>
  <!-- Card tilt: deferred module, Tier A only, CSS-transform based (no WebGL context) -->
  <script type="module">
    import { initCardTilt } from '/static/js/card-tilt.js';
    // Runs after DOMContentLoaded (type=module is always deferred)
    initCardTilt();
  </script>

</body>
</html>
