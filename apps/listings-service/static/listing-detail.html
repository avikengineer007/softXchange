<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details — softXchange</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    .detail-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 36px;
      margin-top: 24px;
    }
    .detail-card {
      background: var(--bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-card {
      background: var(--bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-subtle);
      height: fit-content;
    }
    .security-terminal {
      background: #0d1f18;
      border: 1px solid #164e3f;
      border-radius: 6px;
      padding: 20px;
      color: #a7f3d0;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      margin: 24px 0;
      position: relative;
    }
    .security-terminal-title {
      color: #34d399;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1a3d31;
      padding-bottom: 8px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f0eee6;
      font-size: 13px;
    }
    .meta-label {
      color: var(--color-ink-muted);
    }
    .meta-value {
      font-weight: 500;
      color: var(--color-ink);
    }
    .buy-btn {
      width: 100%;
      padding: 14px;
      background: var(--color-seal);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s ease;
    }
    .buy-btn:hover {
      background: var(--color-seal-dark);
    }
    .breadcrumb {
      font-size: 13px;
      color: var(--color-ink-muted);
      margin-bottom: 16px;
    }
    .breadcrumb a {
      color: var(--color-seal);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <a href="/static/browse-listings.html" class="brand-link">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#164e3f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      <h1>softXchange</h1>
    </a>
    <nav class="nav-links">
      <a href="/static/browse-listings.html">Catalog</a>
      <a href="/static/seller-listings.html">Seller Portal</a>
      <a href="http://localhost:8001/static/customer-login.html" target="_blank">Sign In</a>
    </nav>
  </header>

  <main class="container">
    <!-- Buyer Session Bar -->
    <div style="background: #f0eee6; border: 1px solid var(--color-border); border-radius: 6px; padding: 10px 16px; display: flex; gap: 12px; align-items: center; margin-bottom: 20px; font-size: 13px;">
      <span style="font-weight: 600;">Buyer Access Token:</span>
      <input type="password" id="buyer-token-input" placeholder="Bearer ey..." style="flex: 1; padding: 6px 10px; border: 1px solid var(--color-border); border-radius: 4px; font-family: monospace; font-size: 12px;">
      <button class="buy-btn" style="width: auto; margin-top: 0; padding: 6px 14px; font-size: 12px;" onclick="saveBuyerToken()">Set Token</button>
      <span id="buyer-token-status" style="color: var(--color-ink-muted);"></span>
    </div>

    <div class="breadcrumb">
      <a href="/static/browse-listings.html">&larr; Back to Catalog</a>
    </div>

    <div id="content-container">
      <div style="text-align: center; padding: 60px; color: var(--color-ink-muted);">
        Loading package details...
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const listingId = urlParams.get('id');

    async function loadListing() {
      const container = document.getElementById('content-container');
      if (!listingId) {
        container.innerHTML = '<div style="color: #b91c1c; text-align: center;">No listing ID specified.</div>';
        return;
      }

      try {
        const res = await fetch(`/listings/${listingId}`);
        if (!res.ok) {
          if (res.status === 404) {
            container.innerHTML = '<div style="text-align: center; padding: 48px;"><h3>Listing not found or not published.</h3></div>';
            return;
          }
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        renderListing(data);
      } catch (err) {
        container.innerHTML = `<div style="color: #b91c1c; text-align: center; padding: 32px;">Error loading listing: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderListing(item) {
      const container = document.getElementById('content-container');
      const formattedPrice = item.price_cents === 0 ? 'Free' : `$${(item.price_cents / 100).toFixed(2)}`;

      container.innerHTML = `
        <div class="detail-layout">
          <div class="detail-card">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
              <span class="card-category">${escapeHtml(item.category || 'Software')}</span>
              <span class="status-pill status-live">Live in Catalog</span>
            </div>

            <h1 style="font-family: var(--font-serif); font-size: 32px; color: var(--color-seal-dark); margin-bottom: 16px;">
              ${escapeHtml(item.title)}
            </h1>

            <p style="font-size: 15px; color: var(--color-ink); line-height: 1.7; white-space: pre-wrap; margin-bottom: 32px;">
              ${escapeHtml(item.description || 'No description provided.')}
            </p>

            <div class="security-terminal">
              <div class="security-terminal-title">
                <span class="dot" style="background:#34d399; width:8px; height:8px; border-radius:50%; display:inline-block;"></span>
                <span>SECURITY VERIFICATION SEAL</span>
              </div>
              <div>[✓] Secret Scanner Engine: v1.0.0 passed</div>
              <div>[✓] Critical findings: 0</div>
              <div>[✓] High findings: 0</div>
              <div>[✓] Seller KYC &amp; Payout Gate: Verified &amp; Cleared</div>
              <div>[✓] Code Signature: Validated &amp; Unaltered</div>
              <div style="margin-top: 8px; color: #6ee7b7; font-size: 11px;">
                Status: SECURE &bull; Checked via independent softXchange verification pipeline.
              </div>
            </div>

            <h3 style="font-family: var(--font-serif); font-size: 18px; margin-bottom: 12px;">Package Specifications</h3>
            <div class="meta-row">
              <span class="meta-label">Active Version</span>
              <span class="meta-value" style="font-family: monospace;">v${escapeHtml(item.current_version || '1.0.0')}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Listing ID</span>
              <span class="meta-value" style="font-family: monospace; font-size: 11px;">${escapeHtml(item.id)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Seller Reference</span>
              <span class="meta-value" style="font-family: monospace; font-size: 11px;">${escapeHtml(item.seller_id)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Last Updated</span>
              <span class="meta-value">${new Date(item.updated_at).toLocaleDateString()}</span>
            </div>
          </div>

          <div class="sidebar-card">
            <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--color-ink-muted); margin-bottom: 4px;">License Price</div>
            <div style="font-family: var(--font-serif); font-size: 34px; font-weight: 600; color: var(--color-seal-dark); margin-bottom: 12px;">
              ${formattedPrice}
            </div>

            <button class="buy-btn" onclick="initiatePurchase('${item.id}')">
              Acquire Software License
            </button>

            <div style="margin-top: 16px; font-size: 12px; color: var(--color-ink-subtle); text-align: center;">
              Instant digital access upon purchase. Cryptographically verified against tamper.
            </div>
          </div>
        </div>
      `;
    }

    function initBuyerToken() {
      const token = localStorage.getItem('buyer_access_token') || '';
      if (token) {
        document.getElementById('buyer-token-input').value = token;
        document.getElementById('buyer-token-status').textContent = 'Token set in session';
      }
    }

    function saveBuyerToken() {
      const val = document.getElementById('buyer-token-input').value.trim();
      if (val) {
        const token = val.replace(/^Bearer\s+/i, '');
        localStorage.setItem('buyer_access_token', token);
        document.getElementById('buyer-token-status').textContent = 'Token saved!';
      }
    }

    async function initiatePurchase(listingId) {
      let token = localStorage.getItem('buyer_access_token') || '';
      if (!token) {
        token = prompt('Please paste your buyer JWT access token to proceed with purchase:');
        if (token) {
          token = token.trim();
          localStorage.setItem('buyer_access_token', token);
          initBuyerToken();
        } else {
          alert('Buyer access token is required to proceed with purchase.');
          return;
        }
      }

      try {
        const res = await fetch('http://localhost:8004/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ listing_id: listingId })
        });
        if (!res.ok) {
          const err = await res.json();
          alert('Purchase failed: ' + (err.detail || res.statusText));
          return;
        }
        const order = await res.json();
        window.location.href = `http://localhost:8004/static/checkout.html?order_id=${order.id}&client_secret=${order.client_secret || ''}`;
      } catch (err) {
        alert('Checkout error: ' + err.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initBuyerToken();
      loadListing();
    });
  </script>
</body>
</html>
