<!DOCTYPE html>
<html lang="en" data-tier="C">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details — softXchange</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .detail-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 36px;
      margin-top: 24px;
    }
    @media (max-width: 860px) {
      .detail-layout {
        grid-template-columns: 1fr;
      }
    }
    .detail-card {
      background: var(--bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 32px;
      box-shadow: var(--shadow-subtle);
    }
    .sidebar-card {
      background: var(--bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 28px;
      box-shadow: var(--shadow-subtle);
      height: fit-content;
    }
    .security-terminal {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 20px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      margin: 24px 0;
      position: relative;
    }
    .security-terminal-title {
      color: var(--badge-green);
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 8px;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-border-subtle);
      font-size: 13px;
    }
    .meta-label {
      color: var(--text-secondary);
    }
    .meta-value {
      font-weight: 500;
      color: var(--text-primary);
    }
    .buy-btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-accent);
      color: var(--text-primary);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: transform var(--transition-fast) var(--easing-standard),
                  filter var(--transition-fast) var(--easing-standard),
                  box-shadow var(--transition-fast) var(--easing-standard);
      box-shadow: var(--shadow-gradient-glow);
    }
    .buy-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    .buy-btn:active {
      transform: translateY(0) scale(0.98);
    }
    .breadcrumb {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .breadcrumb a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }
    .breadcrumb a:hover {
      text-decoration: underline;
    }
    .session-bar {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      font-size: 13px;
    }
    /* Scan-resolution depth flourish (Tier A) — added to .scan-resolve-card class
       which is applied to the security-terminal div at resolution time.
       The perspective wrapper (.scan-resolve-card) is in tokens.css.
       This keyframe applies a subtle card-flip (never past 8 deg) on resolution. */
    @keyframes scanResolveTilt3D {
      0%   { transform: perspective(800px) rotateY(0deg) scale(1); }
      25%  { transform: perspective(800px) rotateY(6deg) scale(1.01); }
      60%  { transform: perspective(800px) rotateY(-2deg) scale(1.005); }
      100% { transform: perspective(800px) rotateY(0deg) scale(1); }
    }
    /* Only play 3D flourish on Tier A */
    [data-tier="A"] .scan-resolve-3d {
      animation: scanResolveTilt3D 480ms var(--easing-decelerate) forwards;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="site-nav">
    <a href="/static/index.html" class="brand-link">
      <!-- Geometric Bowtie Logo Mark -->
      <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="ld-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--accent-blue)"/>
            <stop offset="100%" stop-color="var(--accent-violet)"/>
          </linearGradient>
        </defs>
        <path d="M4 5v14l8-7-8-7zm16 0v14l-8-7 8-7z" fill="url(#ld-grad)"/>
      </svg>
      <h1>softXchange</h1>
    </a>
    <nav class="nav-links" id="site-nav-links">
      <a href="/static/browse-listings.html">Catalog</a>
      <a href="/static/seller-listings.html">Seller Portal</a>
      <a href="http://localhost:8001/static/login-customer.html">Sign In</a>
    </nav>
  </header>

  <main class="container page-transition">
    <!-- Buyer Session Bar -->
    <div class="session-bar">
      <span style="font-weight: 600; color: var(--text-primary);">Buyer Access Token:</span>
      <input type="password" id="buyer-token-input" placeholder="Bearer ey..." class="search-input" style="flex: 1; min-width: auto; padding: 6px 12px; font-family: var(--font-mono); font-size: 12px;">
      <button class="action-btn" style="padding: 6px 14px; font-size: 12px;" onclick="saveBuyerToken()">Set Token</button>
      <span id="buyer-token-status" style="color: var(--text-secondary); font-size: 12px;"></span>
    </div>

    <div class="breadcrumb">
      <a href="/static/browse-listings.html">&larr; Back to Catalog</a>
    </div>

    <div id="content-container">
      <div style="text-align: center; padding: 60px; color: var(--text-secondary);">
        Loading package details...
      </div>
    </div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const listingId = urlParams.get('id');

    async function loadListing() {
      const container = document.getElementById('content-container');
      if (!listingId) {
        container.innerHTML = '<div style="color: var(--color-danger); text-align: center;">No listing ID specified.</div>';
        return;
      }

      try {
        const apiHost = window.location.port === "8003" ? "" : "http://localhost:8003";
        const res = await fetch(`${apiHost}/listings/${listingId}`);
        if (!res.ok) {
          if (res.status === 404) {
            container.innerHTML = '<div style="text-align: center; padding: 48px;"><h3 style="color: var(--text-secondary);">Listing not found or not published.</h3></div>';
            return;
          }
          throw new Error(`HTTP ${res.status}`);
        }
        const data = await res.json();
        renderListing(data);
      } catch (err) {
        container.innerHTML = `<div style="color: var(--color-danger); text-align: center; padding: 32px;">Error loading listing: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderListing(item) {
      const container = document.getElementById('content-container');
      const formattedPrice = item.price_cents === 0 ? 'Free' : `$${(item.price_cents / 100).toFixed(2)}`;

      container.innerHTML = `
        <div class="detail-layout">
          <div class="detail-card">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
              <span class="card-category">${escapeHtml(item.category || 'Software')}</span>
              <span class="status-pill status-live">Live in Catalog</span>
            </div>

            <h1 style="font-family: var(--font-heading); font-size: 30px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px;">
              ${escapeHtml(item.title)}
            </h1>

            <p style="font-size: 15px; color: var(--text-secondary); line-height: 1.7; white-space: pre-wrap; margin-bottom: 32px;">
              ${escapeHtml(item.description || 'No description provided.')}
            </p>

            <div class="security-terminal">
              <div class="security-terminal-title">
                <span class="dot" style="background: var(--badge-green); width:8px; height:8px; border-radius:50%; display:inline-block;"></span>
                <span>SECURITY VERIFICATION SEAL</span>
              </div>
              <div>[✓] Secret Scanner Engine: v1.0.0 passed</div>
              <div>[✓] Critical findings: 0</div>
              <div>[✓] High findings: 0</div>
              <div>[✓] Seller KYC &amp; Payout Gate: Verified &amp; Cleared</div>
              <div>[✓] Code Signature: Validated &amp; Unaltered</div>
              <div style="margin-top: 8px; color: var(--text-secondary); font-size: 11px;">
                Status: SECURE &bull; Checked via independent softXchange verification pipeline.
              </div>
            </div>

            <h3 style="font-family: var(--font-heading); font-size: 18px; margin-bottom: 12px; color: var(--text-primary);">Package Specifications</h3>
            <div class="meta-row">
              <span class="meta-label">Active Version</span>
              <span class="meta-value" style="font-family: var(--font-mono);">v${escapeHtml(item.current_version || '1.0.0')}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Listing ID</span>
              <span class="meta-value" style="font-family: var(--font-mono); font-size: 11px;">${escapeHtml(item.id)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Seller Reference</span>
              <span class="meta-value" style="font-family: var(--font-mono); font-size: 11px;">${escapeHtml(item.seller_id)}</span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Last Updated</span>
              <span class="meta-value">${new Date(item.updated_at).toLocaleDateString()}</span>
            </div>
          </div>

          <div class="sidebar-card">
            <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0.04em;">License Price</div>
            <div style="font-family: var(--font-heading); font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px;">
              ${formattedPrice}
            </div>

            <button class="buy-btn" onclick="initiatePurchase('${item.id}')">
              Acquire Software License
            </button>

            <div style="margin-top: 16px; font-size: 12px; color: var(--text-muted); text-align: center;">
              Instant digital access upon purchase. Cryptographically verified against tamper.
            </div>
          </div>
        </div>
      `;
    }

    function initBuyerToken() {
      const token = localStorage.getItem('buyer_access_token') || '';
      if (token) {
        document.getElementById('buyer-token-input').value = token;
        document.getElementById('buyer-token-status').textContent = 'Token active in session';
      }
    }

    function saveBuyerToken() {
      const val = document.getElementById('buyer-token-input').value.trim();
      if (val) {
        const token = val.replace(/^Bearer\s+/i, '');
        localStorage.setItem('buyer_access_token', token);
        document.getElementById('buyer-token-status').textContent = 'Token saved!';
      }
    }

    async function initiatePurchase(listingId) {
      let token = localStorage.getItem('buyer_access_token') || '';
      if (!token) {
        token = prompt('Please paste your buyer JWT access token to proceed with purchase:');
        if (token) {
          token = token.trim();
          localStorage.setItem('buyer_access_token', token);
          initBuyerToken();
        } else {
          alert('Buyer access token is required to proceed with purchase.');
          return;
        }
      }

      try {
        const res = await fetch('http://localhost:8004/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ listing_id: listingId })
        });
        if (!res.ok) {
          const err = await res.json();
          alert('Purchase failed: ' + (err.detail || res.statusText));
          return;
        }
        const order = await res.json();
        window.location.href = `http://localhost:8004/static/checkout.html?order_id=${order.id}&client_secret=${order.client_secret || ''}`;
      } catch (err) {
        alert('Checkout error: ' + err.message);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initBuyerToken();
      loadListing();

      try {
        const token = localStorage.getItem('seller_access_token') || localStorage.getItem('admin_access_token');
        if (token) {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const roles = payload.roles || [];
          const nav = document.getElementById('site-nav-links');
          if (roles.includes('admin')) {
            const adminLink = document.createElement('a');
            adminLink.href = 'http://localhost:8001/static/admin-dashboard.html';
            adminLink.className = 'nav-admin-link';
            adminLink.innerHTML = '🛡\uFE0F Admin Console';
            nav.prepend(adminLink);
          }
        }
      } catch (e) {}
    });
  </script>

  <!-- Tier detection + scan-resolve depth enhancement (deferred, Tier A only) -->
  <script type="module">
    import { getDeviceTier } from '/static/js/tier-detection.js';

    // Apply depth flourish to the security terminal on Tier A
    // We observe the content-container for when the listing renders,
    // then patch the security-terminal to add the 3D animation on resolution.
    const { tier } = getDeviceTier();

    if (tier === 'A') {
      // MutationObserver: watch for the security-terminal to appear
      const contentContainer = document.getElementById('content-container');
      if (contentContainer) {
        const mo = new MutationObserver(() => {
          const terminal = document.querySelector('.security-terminal');
          if (!terminal) return;
          mo.disconnect();

          // Wrap the terminal in a perspective container
          terminal.classList.add('scan-resolve-card');

          // Apply 3D depth flourish once (non-repeating, decorative only)
          // Short delay so the badge is already painted before the animation starts
          requestAnimationFrame(() => {
            terminal.classList.add('scan-resolve-3d');
          });
        });
        mo.observe(contentContainer, { childList: true, subtree: true });
      }
    }
  </script>

</body>
</html>
